<main class="news-page">
  <div class="news-wrap">
    <a class="news-back" href="../index.html">← НА ГЛАВНУЮ</a>
    <h1>NEWS</h1>
    <div id="news-list" class="news-list" aria-live="polite"></div>
  </div>
</main>
<script>
fetch('./news.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('news.json');return r.json()})
  .then(items=>{
    const list=document.getElementById('news-list');
    if(!items.length){list.innerHTML='<p class="news-empty">Здесь будут появляться новые съёмки, альбомы и обновления сайта.</p>';return;}
    items.forEach(item=>{
      const article=document.createElement('article'); article.className='news-item';
      const date=document.createElement('time'); date.className='news-date'; date.textContent=item.date;
      article.appendChild(date);
      const text=document.createElement(item.url?'a':'div'); text.className='news-text'; text.textContent=item.text;
      if(item.url){text.href=item.url; if(/^https?:/.test(item.url)){text.target='_blank';text.rel='noopener noreferrer';} const arrow=document.createElement('span');arrow.setAttribute('aria-hidden','true');arrow.textContent=' ↗';text.appendChild(arrow);}
      article.appendChild(text); list.appendChild(article);
    });
  })
  .catch(()=>{document.getElementById('news-list').innerHTML='<p class="news-empty">Новости временно недоступны.</p>'});
</script>
